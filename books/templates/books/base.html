<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業級圖書館管理系統 (Book & BookCopy 架構)</title>
    <!-- Google Fonts: Roboto & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            background-color: #f4f6f9;
        }
        .barcode-badge {
            font-family: 'Roboto', monospace;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'books:index' %}">
                <i class="fa-solid fa-book-open-reader me-2"></i>智慧圖書館管理系統
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">
                    <i class="fa-solid fa-user-circle me-1"></i>{{ request.user.username }}
                    {% if is_librarian %}<span class="badge bg-warning text-dark ms-1">館員</span>{% endif %}
                </span>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- 快速條碼作業區 (借閱 / 歸還) -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title fw-bold text-primary mb-3">
                            <i class="fa-solid fa-barcode me-2"></i>掃描條碼借閱書籍
                        </h6>
                        <form hx-post="{% url 'books:borrow_copy' %}" hx-target="#workspace-container" hx-swap="innerHTML" class="d-flex gap-2">
                            <input type="text" name="barcode" class="form-control" placeholder="輸入或掃描副本條碼 (例: LIB-1234-001-...)" required>
                            <button type="submit" class="btn btn-primary text-nowrap">
                                <i class="fa-solid fa-hand-holding-heart me-1"></i>借閱
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title fw-bold text-success mb-3">
                            <i class="fa-solid fa-rotate-left me-2"></i>掃描條碼歸還書籍
                        </h6>
                        <form hx-post="{% url 'books:return_copy' %}" hx-target="#workspace-container" hx-swap="innerHTML" class="d-flex gap-2">
                            <input type="text" name="barcode" class="form-control" placeholder="輸入歸還副本條碼" required>
                            <button type="submit" class="btn btn-success text-nowrap">
                                <i class="fa-solid fa-check-circle me-1"></i>歸還
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        {% if is_librarian %}
        <!-- 館員專區：新增書目與副本入庫 -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">
                <i class="fa-solid fa-plus-circle text-primary me-2"></i>館員入庫作業：新增書目與館藏副本
            </div>
            <div class="card-body">
                <form hx-post="{% url 'books:add_book' %}" hx-target="#workspace-container" hx-swap="innerHTML" class="row g-2">
                    <div class="col-md-3">
                        <input type="text" name="title" class="form-control" placeholder="書名 *" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="isbn" class="form-control" placeholder="ISBN *" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="author" class="form-control" placeholder="作者 *" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="publisher" class="form-control" placeholder="出版社 *" required>
                    </div>
                    <div class="col-md-1">
                        <input type="number" name="copy_count" class="form-control" value="2" min="1" max="50" title="副本數量" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-dark w-100">
                            <i class="fa-solid fa-boxes-stacked me-1"></i>建立並上架
                        </button>
                    </div>
                </form>
            </div>
        </div>
        {% endif %}

        <!-- HTMX 動態工作區 (書目列表、個人借閱與預約狀態) -->
        <div id="workspace-container">
            {% include "books/partials/book_list.html" %}
        </div>
    </div>

    {% include "books/partials/modal_alert.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 監聽後端 HX-Trigger 事件並顯示 Bootstrap Modal 通知
        document.body.addEventListener("showModalAlert", function(evt) {
            const detail = evt.detail;
            const modalEl = document.getElementById("systemAlertModal");
            const headerEl = document.getElementById("modalAlertHeader");
            document.getElementById("modalAlertTitle").innerText = detail.title;
            document.getElementById("modalAlertBody").innerText = detail.message;

            headerEl.className = "modal-header text-white bg-" + (detail.level || "primary");
            const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
            modalInstance.show();
        });
    </script>
</body>
</html>
