<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖書館管理系統 | Django + HTMX</title>
    <!-- Google Fonts: Roboto & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'books:book_list' %}">
                <i class="fa-solid fa-book-open-reader me-2"></i>智慧圖書館流通系統
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3"><i class="fa-solid fa-user-shield me-1"></i>{{ request.user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-right-from-bracket me-1"></i>登出
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- 條碼與關鍵字即時搜尋列 -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-barcode text-primary"></i></span>
                    <input type="text"
                           name="q"
                           class="form-control"
                           placeholder="掃描書籍條碼、輸入 ISBN 或書名即時過濾..."
                           value="{{ query|default:'' }}"
                           hx-get="{% url 'books:book_list' %}"
                           hx-trigger="keyup changed delay:300ms"
                           hx-target="#book-list-container"
                           hx-push-url="true">
                </div>
            </div>
        </div>

        <!-- HTMX 動態替換目標區 -->
        <div id="book-list-container">
            {% include 'books/partials/book_list.html' %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('showNotificationModal', function () {
            const modalEl = document.getElementById('htmxAlertModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        });
    </script>
</body>
</html>
