<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登入 - 智慧圖書館管理系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            background-color: #f4f6f9;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow-sm" style="width: 100%; max-width: 420px;">
        <div class="card-header bg-primary text-white text-center py-3">
            <h5 class="mb-0 fw-bold">
                <i class="fa-solid fa-book-open-reader me-2"></i>智慧圖書館管理系統
            </h5>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
            <div class="alert alert-danger py-2 small">
                <i class="fa-solid fa-circle-exclamation me-1"></i>帳號或密碼錯誤，請重新輸入。
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label fw-medium">使用者帳號</label>
                    <input type="text" name="username" class="form-control" placeholder="請輸入帳號" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">密碼</label>
                    <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="fa-solid fa-right-to-bracket me-1"></i>登入系統
                </button>
            </form>
        </div>
    </div>
</body>
</html>
